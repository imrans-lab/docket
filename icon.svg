<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background rounded rect -->
  <rect x="8" y="8" width="240" height="240" rx="32" ry="32" fill="#2b2d42"/>

  <!-- Bottom paper (slightly rotated right) -->
  <g transform="translate(128,140) rotate(6) translate(-128,-140)">
    <rect x="52" y="48" width="152" height="192" rx="6" ry="6" fill="#8d99ae" stroke="#4a4e69" stroke-width="2"/>
    <!-- Lines on bottom paper -->
    <line x1="72" y1="88" x2="184" y2="88" stroke="#4a4e69" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="72" y1="108" x2="170" y2="108" stroke="#4a4e69" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="72" y1="128" x2="178" y2="128" stroke="#4a4e69" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Middle paper (slightly rotated left) -->
  <g transform="translate(128,136) rotate(-4) translate(-128,-136)">
    <rect x="52" y="44" width="152" height="192" rx="6" ry="6" fill="#c4c8d8" stroke="#4a4e69" stroke-width="2"/>
    <!-- Lines on middle paper -->
    <line x1="72" y1="84" x2="184" y2="84" stroke="#4a4e69" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="72" y1="104" x2="160" y2="104" stroke="#4a4e69" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="72" y1="124" x2="174" y2="124" stroke="#4a4e69" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <line x1="72" y1="144" x2="150" y2="144" stroke="#4a4e69" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Top paper (straight) -->
  <g>
    <rect x="52" y="40" width="152" height="192" rx="6" ry="6" fill="#edf2f4" stroke="#4a4e69" stroke-width="2"/>
    <!-- Dog-ear fold -->
    <path d="M 174 40 L 204 40 L 204 70 Z" fill="#c4c8d8" stroke="#4a4e69" stroke-width="1.5"/>
    <path d="M 174 40 L 174 70 L 204 70" fill="none" stroke="#4a4e69" stroke-width="1.5"/>
    <!-- Checkbox squares -->
    <rect x="68" y="72" width="14" height="14" rx="2" fill="none" stroke="#4a4e69" stroke-width="2"/>
    <rect x="68" y="100" width="14" height="14" rx="2" fill="none" stroke="#4a4e69" stroke-width="2"/>
    <rect x="68" y="128" width="14" height="14" rx="2" fill="none" stroke="#4a4e69" stroke-width="2"/>
    <rect x="68" y="156" width="14" height="14" rx="2" fill="none" stroke="#4a4e69" stroke-width="2"/>
    <rect x="68" y="184" width="14" height="14" rx="2" fill="none" stroke="#4a4e69" stroke-width="2"/>
    <!-- Checkmarks in first two -->
    <path d="M 71 79 L 75 83 L 82 74" fill="none" stroke="#2b9348" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 71 107 L 75 111 L 82 102" fill="none" stroke="#2b9348" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Text lines next to checkboxes -->
    <line x1="92" y1="79" x2="184" y2="79" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="107" x2="168" y2="107" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="135" x2="178" y2="135" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="163" x2="156" y2="163" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="191" x2="172" y2="191" stroke="#2b2d42" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Strikethrough on completed items -->
    <line x1="92" y1="79" x2="184" y2="79" stroke="#2b9348" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="92" y1="107" x2="168" y2="107" stroke="#2b9348" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Small "D" badge in corner -->
  <circle cx="196" cy="208" r="24" fill="#ef233c" stroke="#2b2d42" stroke-width="3"/>
  <text x="196" y="217" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#edf2f4" text-anchor="middle">D</text>
</svg>
