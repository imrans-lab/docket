name: Secret range scan
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install gitleaks
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: "set -euo pipefail\nTARBALL=\"gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\"\ncurl -fsSL -o \"$TARBALL\"\
        \ \\\n  \"https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}\"\necho\
        \ \"${GITLEAKS_SHA256}  ${TARBALL}\" | sha256sum -c -\ntar xzf \"$TARBALL\" gitleaks\nsudo mv gitleaks /usr/local/bin/\n\
        gitleaks version\n"
    - name: Scan the event commit range
      env:
        SECRET_SCAN_TARGET: main
      run: scripts/ci/scan-secrets.sh
