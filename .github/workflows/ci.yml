name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.2"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later removed is still
          # leaked. A shallow clone would scan only the tip and miss it.
          fetch-depth: 0

      # The binary is fetched and checksum-verified rather than using
      # gitleaks-action: that action needs a paid licence for organisation
      # accounts, and pinning the release ourselves keeps the supply chain
      # explicit — same posture as the Godot and export-template downloads.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "$TARBALL" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan git history
        run: gitleaks git . -c .gitleaks.toml --no-banner --redact --verbose

      - name: Scan working tree
        run: gitleaks dir . -c .gitleaks.toml --no-banner --redact --verbose

  test:
    name: Build extension + run tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SCons
        run: pipx install scons

      # godot-cpp dominates build time and only changes when the pinned
      # submodule commit changes, so key the cache on that SHA.
      - name: Cache godot-cpp objects
        uses: actions/cache@v4
        with:
          path: |
            third_party/godot-sqlite/godot-cpp/bin
            third_party/godot-sqlite/godot-cpp/gen
            third_party/godot-sqlite/.sconsign.dblite
          key: godot-cpp-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('.gitmodules') }}-${{ hashFiles('third_party/godot-sqlite/godot-cpp/SConstruct') }}

      # Builds both template_release and template_debug. The debug variant is
      # what the Godot tool binary loads when running the test suite; without it
      # the extension silently fails to load and ~50 tests fail confusingly.
      - name: Build GDExtension from source
        run: ./scripts/build/build_gdextension.sh ${{ matrix.platform }} ${{ matrix.arch }} all

      # Secret scan, machine-path leakage, FCIB, version skew, dead links.
      # Cheap, so it runs on every push rather than only before a release.
      - name: Preflight checks
        run: ./scripts/build/preflight.sh

      - name: Cache Godot binary
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-${{ matrix.os }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-bin && cd ~/godot-bin
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ "${{ runner.os }}" = "macOS" ]; then
            curl -fSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          else
            curl -fSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          fi
          unzip -q godot.zip && rm godot.zip

      - name: Resolve Godot path
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            GODOT_BIN="$HOME/godot-bin/Godot.app/Contents/MacOS/Godot"
          else
            GODOT_BIN="$(find "$HOME/godot-bin" -maxdepth 1 -name 'Godot_v*' -type f | head -1)"
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      # First headless run imports assets and registers class_name globals.
      # Without this, scripts using class_name fail to resolve and the run hangs.
      - name: Import project
        run: |
          "$GODOT_BIN" --headless --path . --import 2>&1 | tail -20 || true

      - name: Run test suite
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . -- test 2>&1 | tee test-output.txt
          grep -q "ALL TESTS PASSED" test-output.txt

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.platform }}
          path: test-output.txt
