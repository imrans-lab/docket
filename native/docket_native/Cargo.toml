[package]
name = "docket_native"
version = "0.1.0"
edition = "2021"
# std File::lock / lock_shared / try_lock are stable from 1.89.
rust-version = "1.89"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact pin. The 4.5 API loads in every later Godot, including the 4.6 hosts
# that embed Docket.
godot = { version = "=0.4.5", default-features = false, features = ["api-4-5"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[profile.release]
strip = "debuginfo"
